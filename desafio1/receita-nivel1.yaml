
#cloud-config
package_update: true

packages:
  - nginx

write_files:
  - path: /var/www/html/index.html
    content: |
      <!DOCTYPE html>
      <html lang="pt-BR">
      <head>
          <meta charset="UTF-8">
          <title>Servidor Automatizado</title>
      </head>
      <body>
          <h1>Sucesso! Minha primeira VM foi configurada com Cloud-init.</h1>
      </body>
      </html>

runcmd:
  - systemctl restart nginx
