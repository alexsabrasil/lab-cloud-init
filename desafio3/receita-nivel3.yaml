
#cloud-config
package_update: true

packages:
  - docker.io
  - git

users:
  - default
  - name: aluno
    groups: sudo, docker
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL

write_files:
  - path: /home/aluno/bem-vindo.txt
    content: |
      Bem-vindo ao Desafio 3!
      Ambiente provisionado automaticamente com Cloud-init.
    permissions: '0644'

runcmd:
  - chown -R aluno:aluno /home/aluno
  - systemctl enable --now docker
  - docker run -d --name grafana -p 3000:3000 grafana/grafana:latest
